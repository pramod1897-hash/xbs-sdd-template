name: Validate SDD Template

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'validate_sdd.py'
      - 'tests/**'
      - '.github/workflows/validate-sdd.yml'
  pull_request:
    paths:
      - '**.md'
      - 'validate_sdd.py'
      - 'tests/**'
      - '.github/workflows/validate-sdd.yml'

jobs:
  validate-template:
    name: Validate SDD Template Structure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate the SDD template itself
        run: |
          python validate_sdd.py sdd-template.md

      - name: Install test dependencies
        run: pip install pytest

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v

      - name: Validate any SDD documents in the repository
        run: |
          # Find all markdown files that are NOT the template itself
          shopt -s globstar nullglob
          has_failure=0
          for sdd in docs/**/*.md docs/*.md; do
            echo "Validating: $sdd"
            python validate_sdd.py "$sdd" || has_failure=1
          done
          exit $has_failure
        shell: bash
        continue-on-error: false
